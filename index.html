<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Turtlediary | 100+ Free Educational Games for kids </title>
  <meta name="description" content="Turtlediary Baby Games is a unique interactive world for 0 to 6 year olds. free games for 2,3,4 year olds. play educational and funny kids games online at Turtlediary, Play games such as knowledge games, toddler games, learing games, vocabulary games, brain games, alphabet games, logic games, music games, memory games, Try it now!" />

  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="full-screen" content="yes"/>
  <meta name="screen-orientation" content="portrait"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  
  <link rel="stylesheet" type="text/css" href="style-desktop.81ede.css"/>

  <meta name="google-adsense-account" content="ca-pub-7319484910540489">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #333;
      overflow-x: hidden;
    }
    /* 游戏外层包装，用于居中和控制溢出 */
    #GameWrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
    }
    /* 游戏本体容器，应用缩放的核心 */
    #GameDiv {
      position: relative;
      transform-origin: top center;
    }
    .header {
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
      margin: 10px 0;
    }
  </style>

  <script>
    // --- 1. 密码保护逻辑 ---
    (function() {
        var password = prompt("此页面受保护，请输入访问密码：");
        if (password !== "123456") {
            alert("密码错误，无法访问！");
            window.location.href = "about:blank"; 
        }
    })();

    // --- 2. 自适应缩放逻辑 ---
    function resizeGame() {
        var gameDiv = document.getElementById('GameDiv');
        var container = document.getElementById('GameWrapper');
        if (!gameDiv || !container) return;

        var designWidth = 1280;
        var designHeight = 720;
        
        // 设定基础缩放比例为 68%
        var baseScale = 0.68;
        
        // 获取浏览器当前宽度
        var windowWidth = window.innerWidth;
        
        // 如果 68% 缩放后仍然宽于屏幕，则进一步缩小以适应屏幕宽度
        var finalScale = Math.min(baseScale, windowWidth / designWidth);
        
        // 应用宽高和缩放
        gameDiv.style.width = designWidth + "px";
        gameDiv.style.height = designHeight + "px";
        gameDiv.style.transform = "scale(" + finalScale + ")";
        
        // 动态调整外层容器高度，消除缩放产生的多余空白
        container.style.height = (designHeight * finalScale) + "px";
    }

    window.addEventListener('resize', resizeGame);
    window.addEventListener('DOMContentLoaded', resizeGame);
  </script>
</head>

<body>
<h1 class="header">Turtlediary | 100+ Free Educational Games for kids</h1>

<div id="GameWrapper">
  <div id="GameDiv">
    <canvas id="GameCanvas" width="1280" height="720"></canvas>
    <div id="splash">
      <div class="progress-bar stripes">
        <span style="width: 0%"></span>
      </div>
    </div>
  </div>
</div>

<script src="src/settings.3b390.js" charset="utf-8"></script>
<script src="main.941a0.js" charset="utf-8"></script>

<script type="text/javascript">
(function () {
    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function loadScript (moduleName, cb) {
      function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.304c8.js' : 'cocos2d-js-min.js', function () {
      if (typeof CC_PHYSICS_BUILTIN !== 'undefined' && (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON)) {
        loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
      }
      else {
        window.boot();
      }
    });
})();
</script>
<script type="text/javascript" src="https://js.users.51.la/14688922.js"></script>
</body>
</html>
