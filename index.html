<script type="text/javascript">
(function () {
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    // --- 2. 核心自适应逻辑：学习参考代码的缩放方式 ---
    function syncGameSize() {
        if (typeof cc !== 'undefined' && cc.view) {
            var container = document.getElementById('GameDiv');
            if (container) {
                var designRatio = 1280 / 720; // 原始设计比例
                
                // 设备检测：宽度小于 1024 视为移动端
                var isMobileOrTablet = window.innerWidth <= 1024;
                // PC 端缩放 65%，移动端 100%
                var scaleFactor = isMobileOrTablet ? 1.0 : 0.65;
                
                var targetWidth = window.innerWidth * scaleFactor;
                var targetHeight = targetWidth / designRatio;

                // 边界检查：防止高度溢出屏幕，给标题留出空间
                var heightLimit = isMobileOrTablet ? 0.95 : 0.75;
                var maxHeight = window.innerHeight * heightLimit;

                if (targetHeight > maxHeight) {
                    targetHeight = maxHeight;
                    targetWidth = targetHeight * designRatio;
                }

                // 应用宽高
                container.style.width = targetWidth + "px";
                container.style.height = targetHeight + "px";

                // 调用 Cocos 引擎 API 同步画布尺寸，保证清晰且不拉伸
                var rect = container.getBoundingClientRect();
                cc.view.setFrameSize(rect.width, rect.height);
                
                if (cc.view._resizeEvent) {
                    cc.view._resizeEvent();
                }
            }
        }
    }

    function loadScript (moduleName, cb) {
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.onload = () => {
          document.body.removeChild(domScript);
          cb && cb();
      };
      document.body.appendChild(domScript);
    }

    var debug = window._CCSettings.debug;

    // 根据你的项目引用正确的引擎文件名
    loadScript(debug ? 'cocos2d-js.304c8.js' : 'cocos2d-js-min.js', function () {
      if (typeof CC_PHYSICS_BUILTIN !== 'undefined' && (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON)) {
        loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
      } else {
        window.boot();
      }

      // 绑定缩放事件并定时检查
      window.addEventListener('resize', syncGameSize);
      setInterval(syncGameSize, 500); 
      setTimeout(syncGameSize, 500);
    });
})();
</script>
