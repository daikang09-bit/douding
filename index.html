<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Turtlediary | 100+ Free Educational Games</title>
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="full-screen" content="yes"/>
  <meta name="screen-orientation" content="portrait"/>
  <meta name="x5-fullscreen" content="true"/>

  <style>
    html, body {
      background-color: #1a1a1a;
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column; 
      align-items: center;
      justify-content: center;
    }

    .header {
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      margin: 10px 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    #GameDiv {
      position: relative;
      width: auto; 
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 0 35px rgba(0,0,0,0.8);
      background-color: #000;
      border: 2px solid #444;
      border-radius: 8px;
      overflow: hidden;
    }

    #GameCanvas {
      width: 100% !important;
      height: 100% !important;
      outline: none;
    }

    #splash {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: #171717; z-index: 5;
    }

    @media screen and (max-width: 1024px) {
      .header { font-size: 16px; margin: 5px 0; }
    }
  </style>

  <script>
    // --- 1. 密码保护逻辑 ---
    (function() {

        if (password !== "123456") {
            alert("密码错误，无法访问！");
            window.location.href = "about:blank";

    })();

<body>
  <h1 class="header">Turtlediary | Educational Games</h1>

  <div id="GameDiv">
    <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    <div id="splash">
      <div class="progress-bar stripes">
        <span style="width: 0%"></span>
      </div>
    </div>
  </div>

<script src="src/settings.3b390.js" charset="utf-8"></script>

<script type="text/javascript">
(function () {
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    // --- 2. 核心自适应逻辑：高度随宽度变化 ---
    function syncGameSize() {
        if (typeof cc !== 'undefined' && cc.view) {
            var container = document.getElementById('GameDiv');
            if (container) {
                var designRatio = 1280 / 720; // 原始纵横比
                
                // 判断设备：宽度小于1024px视为移动端
                var isMobile = window.innerWidth <= 1024;
                // PC端缩放为68%，移动端100%
                var scaleFactor = isMobile ? 1.0 : 0.68;
                
                var targetWidth = window.innerWidth * scaleFactor;
                var targetHeight = targetWidth / designRatio;

                // 边界检查：高度不能超过屏幕
                var heightLimit = isMobile ? 0.92 : 0.75;
                var maxHeight = window.innerHeight * heightLimit;

                if (targetHeight > maxHeight) {
                    targetHeight = maxHeight;
                    targetWidth = targetHeight * designRatio;
                }

                // 应用宽高
                container.style.width = targetWidth + "px";
                container.style.height = targetHeight + "px";

                // 通知 Cocos 引擎更新画布尺寸（防模糊）
                cc.view.setFrameSize(targetWidth, targetHeight);
                
                if (cc.view._resizeEvent) {
                    cc.view._resizeEvent();
                }
            }
        }
    }

    function loadScript (moduleName, cb) {
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.onload = () => {
          document.body.removeChild(domScript);
          cb && cb();
      };
      document.body.appendChild(domScript);
    }

    var debug = window._CCSettings.debug;

    // 加载 Cocos 引擎主文件（请确认你的文件名是 cocos2d-js-min.js）
    loadScript(debug ? 'cocos2d-js.304c8.js' : 'cocos2d-js-min.js', function () {
      if (typeof CC_PHYSICS_BUILTIN !== 'undefined' && (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON)) {
        loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
      } else {
        window.boot();
      }

      // 绑定缩放事件
      window.addEventListener('resize', syncGameSize);
      setInterval(syncGameSize, 1000); // 周期性自检，确保布局稳固
      setTimeout(syncGameSize, 500);
    });
})();
</script>
