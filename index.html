<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Turtlediary | Educational Games</title>
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="full-screen" content="yes"/>
  <meta name="screen-orientation" content="portrait"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  
  <link rel="stylesheet" type="text/css" href="style-desktop.81ede.css"/>
  <link rel="icon" href="favicon.8de18.ico"/>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #222;
      overflow-x: hidden; /* 防止横向滚动条 */
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* 核心包装层：确保游戏永远水平居中 */
    #GameWrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
    }
    /* 游戏容器：所有的缩放魔法都在这里 */
    #GameDiv {
      position: relative;
      transform-origin: top center; /* 以顶部中心为缩放原点 */
    }
    .header {
      text-align: center;
      color: white;
      font-size: 16px;
      margin: 10px 0;
    }
  </style>

  <script>
    // --- 访问密码 ---
    (function() {
        var password = prompt("此页面受保护，请输入访问密码：");
        if (password !== "123456") {
            alert("密码错误！");
            window.location.href = "about:blank"; 
        }
    })();

    // --- 核心：等比例自适应缩放逻辑 ---
    function resizeGame() {
        var gameDiv = document.getElementById('GameDiv');
        var wrapper = document.getElementById('GameWrapper');
        if (!gameDiv || !wrapper) return;

        // 1. 定义 Cocos 导出的原始设计尺寸
        var designWidth = 1280;
        var designHeight = 720;
        
        // 2. 设定你的基础缩放目标 (68%)
        var baseScale = 0.68;
        
        // 3. 计算浏览器当前允许的最大宽度
        var windowWidth = window.innerWidth;
        
        // 4. 计算最终缩放比例
        // 如果窗口宽度足够大，就用 68%
        // 如果窗口宽度变小，就让比例 = 窗口宽 / 原始宽
        var finalScale = Math.min(baseScale, windowWidth / designWidth);
        
        // 5. 应用缩放变换
        gameDiv.style.width = designWidth + "px";
        gameDiv.style.height = designHeight + "px";
        gameDiv.style.transform = "scale(" + finalScale + ")";
        
        // 6. 关键步骤：动态调整外层容器的高度
        // 只有这样，高度才会随宽度等比例缩小，下方不会留黑边
        wrapper.style.height = (designHeight * finalScale) + "px";
    }

    // 监听窗口大小变化和页面加载
    window.addEventListener('resize', resizeGame);
    window.addEventListener('DOMContentLoaded', resizeGame);
  </script>
</head>

<body>
<h1 class="header">Turtlediary | Kids Games</h1>

<div id="GameWrapper">
  <div id="GameDiv">
    <canvas id="GameCanvas" width="1280" height="720"></canvas>
    <div id="splash">
      <div class="progress-bar stripes">
        <span style="width: 0%"></span>
      </div>
    </div>
  </div>
</div>

<script src="src/settings.3b390.js" charset="utf-8"></script>
<script src="main.941a0.js" charset="utf-8"></script>

<script type="text/javascript">
(function () {
    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function loadScript (moduleName, cb) {
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      }, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.304c8.js' : 'cocos2d-js-min.js', function () {
      if (typeof CC_PHYSICS_BUILTIN !== 'undefined' && (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON)) {
        loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
      } else {
        window.boot();
      }
    });
})();
</script>
<script type="text/javascript" src="https://js.users.51.la/14688922.js"></script>
</body>
</html>
